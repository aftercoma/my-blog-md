#######################
#baseurl      = "localhost"
baseURL = 'https://aftercoma.github.io/my-blog-md/'
title        = "archive aftercoma"
defaultContentLanguage = "en"
defaultContentLanguageInSubdir = false
theme        = "rewired"

  [taxonomies]
    tag = "tags"
    category = "categories"
  [params]
    blogPageSize = 5
    title = "Archive site"

    author = "aftercoma/agungxpp"
    descriptionLines  = ["Python dev, Web Scraping enthusiast, & Linux user.",
    "Hacking, Networking All about IT"]
    tagLine = "about"
  [params.toc]
    enabled = true
    ordered = true
    startLevel = 1
    endLeved = 3

  [params.footer]
    text = "made with <3 [HUGO](https://gohugo.io/)"
    prompt = "aftercoma@agungxpp:~$"
  [[menus.main]]
    name = "home"
    pageRef = "/"
    weight = 10 
  [[menus.main]]
    name = "blog"
    pageRef = "/posts/"
    weight = 20 
  [[menus.main]]
    name="about"
    pageRef="/about/"
    weight=30 

  [[params.social]]
    name = "GitHub"
    url = "https://github.com/aftercoma"
    icon = "fa-brands fa-github"
  


